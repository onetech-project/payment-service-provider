      - Token
  /openapi/v1.0/transfer-va/create-va:
    post:
      description: |-
        Merchant-initiated upsert of a Virtual Account (ASPI VAUpsertRequest). This performs a real state-changing action: it creates or updates a persistent Virtual Account record.
        To register a payment-notification callback URL, set additionalInfo.dbUrlProcess (e.g. {"additionalInfo": {"dbUrlProcess": "https://merchant.example.com/webhook/payment-callback"}}) — per ASPI's VAUpsertRequest, this is the only defined key under additionalInfo; it is not a top-level request field.
      parameters:
      - description: Bearer accessToken issued by POST /openapi/v1.0/access-token/b2b
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request timestamp, ISO 8601, must be within ±5 minutes of server
          time
        in: header
        name: X-TIMESTAMP
        required: true
        type: string
      - description: HMAC-SHA512(merchantSecret, \
        in: header
        name: X-SIGNATURE
        required: true
        type: string
      - description: Numeric string, unique per calendar day. Doubles as the idempotency
          key
        in: header
        name: X-EXTERNAL-ID
        required: true
        type: string
