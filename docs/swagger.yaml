basePath: /
definitions:
  domain.AddClientKeyRequest:
    properties:
      algorithm:
        type: string
      keyId:
        type: string
      publicKeyPem:
        type: string
    type: object
  domain.AddClientSecretRequest:
    properties:
      secretId:
        type: string
      secretValue:
        type: string
    type: object
  domain.Amount:
    properties:
      currency:
        type: string
      value:
        type: string
    type: object
  domain.BilingualText:
    properties:
      english:
        type: string
      indonesia:
        type: string
    type: object
  domain.BillDetail:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      billAmount:
        $ref: '#/definitions/domain.Amount'
      billAmountLabel:
        type: string
      billAmountValue:
        type: string
      billCode:
        type: string
      billDescription:
        $ref: '#/definitions/domain.BilingualText'
      billName:
        type: string
      billNo:
        type: string
      billReferenceNo:
        type: string
      billShortName:
        type: string
      billSubCompany:
        type: string
      billerReferenceId:
        type: string
      reason:
        $ref: '#/definitions/domain.BilingualText'
      status:
        type: string
    type: object
  domain.ClientApp:
    properties:
      client_id:
        type: string
      client_name:
        type: string
      created_at:
        type: string
      id:
        type: string
      status:
        $ref: '#/definitions/domain.ClientStatus'
      updated_at:
        type: string
    type: object
  domain.ClientKey:
    properties:
      algorithm:
        type: string
      client_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      key_id:
        type: string
      public_key_pem:
        type: string
      updated_at:
        type: string
    type: object
  domain.ClientSecret:
    properties:
      client_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      secret_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.ClientStatus:
    enum:
    - ACTIVE
    - REVOKED
    - SUSPENDED
    type: string
    x-enum-varnames:
    - ClientStatusActive
    - ClientStatusRevoked
    - ClientStatusSuspended
  domain.MerchantCreateVARequest:
    properties:
      additionalInfo:
        additionalProperties: true
        description: |-
          AdditionalInfo carries proprietary extensions per ASPI VAUpsertRequest's
          additionalInfo.dbUrlProcess slot (aspi-open-api-va.yaml:317-320) — the
          merchant payment callback URL is passed here as additionalInfo.dbUrlProcess,
          not as a top-level field (there is no such field in the spec).
        type: object
      billDetails:
        items:
          $ref: '#/definitions/domain.BillDetail'
        type: array
      customerNo:
        type: string
      expiredDate:
        type: string
      feeAmount:
        $ref: '#/definitions/domain.Amount'
      freeTexts:
        items:
          $ref: '#/definitions/domain.BilingualText'
        type: array
      partnerServiceId:
        type: string
      totalAmount:
        $ref: '#/definitions/domain.Amount'
      trxId:
        type: string
      virtualAccountEmail:
        type: string
      virtualAccountName:
        type: string
      virtualAccountNo:
        type: string
      virtualAccountPhone:
        type: string
      virtualAccountTrxType:
        type: string
    type: object
  domain.MerchantCreateVAResponse:
    properties:
      responseCode:
        type: string
      responseMessage:
        type: string
      virtualAccountData:
        $ref: '#/definitions/domain.MerchantVAData'
    type: object
  domain.MerchantDeleteVAData:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      customerNo:
        type: string
      partnerServiceId:
        type: string
      trxId:
        type: string
      virtualAccountNo:
        type: string
    type: object
  domain.MerchantDeleteVARequest:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      customerNo:
        type: string
      partnerServiceId:
        type: string
      trxId:
        type: string
      virtualAccountNo:
        type: string
    type: object
  domain.MerchantDeleteVAResponse:
    properties:
      responseCode:
        type: string
      responseMessage:
        type: string
      virtualAccountData:
        $ref: '#/definitions/domain.MerchantDeleteVAData'
    type: object
  domain.MerchantListTransactionsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.VATransactionListItem'
        type: array
      pagination:
        $ref: '#/definitions/domain.Pagination'
      responseCode:
        type: string
      responseMessage:
        type: string
    type: object
  domain.MerchantListVARequest:
    properties:
      fromDate:
        type: string
      page:
        type: integer
      pageSize:
        type: integer
      partnerServiceId:
        type: string
      status:
        type: string
      toDate:
        type: string
      virtualAccountNo:
        type: string
    type: object
  domain.MerchantListVAResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.VAAccountListItem'
        type: array
      pagination:
        $ref: '#/definitions/domain.Pagination'
      responseCode:
        type: string
      responseMessage:
        type: string
    type: object
  domain.MerchantVAData:
    properties:
      additionalInfo:
        additionalProperties: true
        description: |-
          AdditionalInfo echoes back additionalInfo.dbUrlProcess per ASPI
          VAUpsertResponse (aspi-open-api-va.yaml:348-351).
        type: object
      billDetails:
        items:
          $ref: '#/definitions/domain.BillDetail'
        type: array
      customerNo:
        type: string
      expiredDate:
        type: string
      feeAmount:
        $ref: '#/definitions/domain.Amount'
      freeTexts:
        items:
          $ref: '#/definitions/domain.BilingualText'
        type: array
      partnerServiceId:
        type: string
      paymentDate:
        description: |-
          lastUpdateDate is deliberately absent: per the ASPI portal it belongs to
          the update-va / update-status / inquiry-va responses, NOT to create-va
          (service code 27), which is the only response this struct serves. The
          local aspi-open-api-va.yaml carries it only because it models create and
          update with one shared VAUpsertResponse schema.
        type: string
      totalAmount:
        $ref: '#/definitions/domain.Amount'
      trxId:
        type: string
      virtualAccountEmail:
        type: string
      virtualAccountName:
        type: string
      virtualAccountNo:
        type: string
      virtualAccountPhone:
        type: string
      virtualAccountTrxType:
        type: string
    type: object
  domain.Pagination:
    properties:
      page:
        type: integer
      pageSize:
        type: integer
      totalPages:
        type: integer
      totalRows:
        type: integer
    type: object
  domain.RegisterClientRequest:
    properties:
      algorithm:
        type: string
      clientId:
        type: string
      clientName:
        type: string
      keyId:
        type: string
      publicKeyPem:
        type: string
    type: object
  domain.SNAPErrorResponse:
    properties:
      data:
        additionalProperties: {}
        type: object
      responseCode:
        type: string
      responseMessage:
        type: string
    type: object
  domain.SNAPTokenRequest:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      grantType:
        type: string
    type: object
  domain.SNAPTokenResponse:
    properties:
      accessToken:
        type: string
      additionalInfo:
        additionalProperties: true
        type: object
      expiresIn:
        type: string
      responseCode:
        type: string
      responseMessage:
        type: string
      tokenType:
        type: string
    type: object
  domain.SignatureAuthResponse:
    properties:
      responseCode:
        type: string
      responseMessage:
        type: string
      signature:
        type: string
    type: object
  domain.SignatureServiceResponse:
    properties:
      responseCode:
        type: string
      responseMessage:
        type: string
      signature:
        type: string
    type: object
  domain.VAAccountData:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      billDetails:
        items:
          $ref: '#/definitions/domain.BillDetail'
        type: array
      customerNo:
        type: string
      feeAmount:
        $ref: '#/definitions/domain.Amount'
      freeTexts:
        items:
          $ref: '#/definitions/domain.BilingualText'
        type: array
      inquiryReason:
        $ref: '#/definitions/domain.BilingualText'
      inquiryRequestId:
        type: string
      inquiryStatus:
        type: string
      partnerServiceId:
        type: string
      subCompany:
        type: string
      totalAmount:
        $ref: '#/definitions/domain.Amount'
      virtualAccountName:
        type: string
      virtualAccountNo:
        type: string
      virtualAccountTrxType:
        type: string
    type: object
  domain.VAAccountListItem:
    properties:
      createdAt:
        type: string
      customerName:
        type: string
      customerNo:
        type: string
      expiredDate:
        type: string
      status:
        type: string
      totalPaid:
        $ref: '#/definitions/domain.Amount'
      transactionCount:
        type: integer
      vaType:
        type: string
      virtualAccountNo:
        type: string
    type: object
  domain.VAInquiryRequest:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      amount:
        allOf:
        - $ref: '#/definitions/domain.Amount'
        description: |-
          Amount is Optional (N) on the inquiry payload. It was absent from the
          table altogether in the older documentation and reappears in
          VA-BillPresentment v2.4; it has never been mandatory, and requiring it
          would reject every inquiry that omits it. Treated as a passthrough: the
          amount a customer entered belongs to the payment, not to the bill this
          inquiry presents.
      channelCode:
        type: integer
      customerNo:
        type: string
      hashedSourceAccountNo:
        description: |-
          HashedSourceAccountNo String(32) and SourceBankCode String(3) are both
          Optional, and both carry the paying account's identity through from the
          channel.
        type: string
      inquiryRequestId:
        type: string
      language:
        description: Language is String(2) ISO-639-1, Optional.
        type: string
      partnerServiceId:
        type: string
      passApp:
        description: |-
          PassApp is String(64) Optional, "Key for 3rd party to access API like
          client secret". Bound and length-checked but never acted on: this
          service authenticates on X-SIGNATURE, and treating a body field as a
          second credential would be a way in that the signature does not cover.
        type: string
      sourceBankCode:
        type: string
      trxDateInit:
        description: |-
          TrxDateInit is spelled trxDateInit by BCA (Developer API BCA, inquiry
          payload). It was previously tagged "txnDateInit", which silently never
          bound.
        type: string
      virtualAccountNo:
        type: string
    type: object
  domain.VAInquiryResponse:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      responseCode:
        type: string
      responseMessage:
        type: string
      virtualAccountData:
        $ref: '#/definitions/domain.VAAccountData'
    type: object
  domain.VAPaymentBillDetail:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      billAmount:
        $ref: '#/definitions/domain.Amount'
      billCode:
        type: string
      billDescription:
        $ref: '#/definitions/domain.BilingualText'
      billName:
        type: string
      billNo:
        type: string
      billReferenceNo:
        type: string
      billShortName:
        type: string
      billSubCompany:
        type: string
      billerReferenceId:
        type: string
      reason:
        $ref: '#/definitions/domain.BilingualText'
      status:
        type: string
    type: object
  domain.VAPaymentRequest:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      billDetails:
        items:
          $ref: '#/definitions/domain.VAPaymentBillDetail'
        type: array
      channelCode:
        type: integer
      cumulativePaymentAmount:
        $ref: '#/definitions/domain.Amount'
      customerNo:
        type: string
      flagAdvise:
        type: string
      freeTexts:
        items:
          $ref: '#/definitions/domain.BilingualText'
        type: array
      hashedSourceAccountNo:
        type: string
      inquiryRequestId:
        description: |-
          InquiryRequestID is kept for backward compatibility with legacy vendors
          still sending it; per ASPI spec, TrxID is the mandatory trace field on
          this endpoint (inquiryRequestId is instead resolved internally from the
          merchant's create-VA record, see va_usecase.go Payment()).
        type: string
      journalNum:
        type: string
      paidAmount:
        $ref: '#/definitions/domain.Amount'
      paidBills:
        type: string
      partnerServiceId:
        type: string
      paymentRequestId:
        type: string
      paymentType:
        type: string
      referenceNo:
        type: string
      sourceBankCode:
        type: string
      subCompany:
        type: string
      totalAmount:
        $ref: '#/definitions/domain.Amount'
      trxDateTime:
        type: string
      trxId:
        type: string
      virtualAccountEmail:
        type: string
      virtualAccountName:
        type: string
      virtualAccountNo:
        type: string
      virtualAccountPhone:
        type: string
    type: object
  domain.VAPaymentResponse:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      responseCode:
        type: string
      responseMessage:
        type: string
      virtualAccountData:
        $ref: '#/definitions/domain.VAPaymentStatus'
    type: object
  domain.VAPaymentStatus:
    properties:
      billDetails:
        items:
          $ref: '#/definitions/domain.VAPaymentBillDetail'
        type: array
      customerNo:
        type: string
      flagAdvise:
        type: string
      freeTexts:
        items:
          $ref: '#/definitions/domain.BilingualText'
        type: array
      journalNum:
        type: string
      paidAmount:
        $ref: '#/definitions/domain.Amount'
      paidBills:
        type: string
      partnerServiceId:
        type: string
      paymentFlagReason:
        $ref: '#/definitions/domain.BilingualText'
      paymentFlagStatus:
        type: string
      paymentRequestId:
        type: string
      paymentType:
        type: string
      referenceNo:
        type: string
      totalAmount:
        $ref: '#/definitions/domain.Amount'
      trxDateTime:
        type: string
      trxId:
        type: string
      virtualAccountEmail:
        type: string
      virtualAccountName:
        description: |-
          VirtualAccountName carries no omitempty: it is reported even when empty,
          including on the not-found rejection where there is no stored holder to
          name. Email/phone below stay omitempty — those are genuinely optional
          and vendors do not expect placeholders for them.
        type: string
      virtualAccountNo:
        type: string
      virtualAccountPhone:
        type: string
    type: object
  domain.VAStatusBillDetail:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      billAmount:
        $ref: '#/definitions/domain.Amount'
      billCode:
        type: string
      billDescription:
        $ref: '#/definitions/domain.BilingualText'
      billName:
        type: string
      billNo:
        type: string
      billReferenceNo:
        type: string
      billShortName:
        type: string
      billSubCompany:
        type: string
      reason:
        $ref: '#/definitions/domain.BilingualText'
      status:
        type: string
    type: object
  domain.VAStatusData:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      billDetails:
        items:
          $ref: '#/definitions/domain.VAStatusBillDetail'
        type: array
      customerNo:
        type: string
      flagAdvise:
        type: string
      freeTexts:
        items:
          $ref: '#/definitions/domain.BilingualText'
        type: array
      inquiryRequestId:
        type: string
      paidAmount:
        $ref: '#/definitions/domain.Amount'
      paidBills:
        type: string
      partnerServiceId:
        type: string
      paymentFlagReason:
        $ref: '#/definitions/domain.BilingualText'
      paymentFlagStatus:
        type: string
      paymentRequestId:
        type: string
      paymentType:
        type: string
      referenceNo:
        type: string
      totalAmount:
        $ref: '#/definitions/domain.Amount'
      transactionDate:
        type: string
      trxDateTime:
        type: string
      virtualAccountNo:
        type: string
    type: object
  domain.VAStatusRequest:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      customerNo:
        type: string
      inquiryRequestId:
        type: string
      partnerServiceId:
        type: string
      paymentRequestId:
        type: string
      virtualAccountNo:
        type: string
    type: object
  domain.VAStatusResponse:
    properties:
      additionalInfo:
        additionalProperties: true
        type: object
      responseCode:
        type: string
      responseMessage:
        type: string
      virtualAccountData:
        $ref: '#/definitions/domain.VAStatusData'
    type: object
  domain.VATransactionListItem:
    properties:
      createdAt:
        type: string
      customerName:
        type: string
      customerNo:
        type: string
      paidAmount:
        $ref: '#/definitions/domain.Amount'
      paymentRequestId:
        type: string
      referenceNo:
        type: string
      status:
        type: string
      totalAmount:
        $ref: '#/definitions/domain.Amount'
      transactionDate:
        type: string
      virtualAccountNo:
        type: string
    type: object
  handler.amount:
    properties:
      currency:
        type: string
      value:
        type: string
    type: object
  handler.clientResponse:
    properties:
      client:
        $ref: '#/definitions/domain.ClientApp'
      key:
        $ref: '#/definitions/domain.ClientKey'
      message:
        type: string
      secret:
        $ref: '#/definitions/domain.ClientSecret'
      status:
        type: string
    type: object
  handler.reconcileErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.reconcileResponse:
    properties:
      outcome:
        type: string
      paidAmount:
        $ref: '#/definitions/handler.amount'
      reconciledAt:
        type: string
      settled:
        type: boolean
      vendorPaymentFlagStatus:
        type: string
      vendorResponseCode:
        description: |-
          The vendor's raw answer is echoed so an operator can see what the
          outcome was inferred from rather than having to trust it.
        type: string
      virtualAccountNo:
        type: string
    type: object
  handler.resendCallbackErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.resendCallbackResponse:
    properties:
      deliveryStatus:
        type: string
      eventType:
        type: string
      resentAt:
        type: string
      virtualAccountNo:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Generic SNAP/ASPI-compliant payment gateway API: B2B access
    token issuance, admin client onboarding, signature-generation
    utilities, and Virtual Account (transfer-VA) transaction and
    merchant-dashboard endpoints.
  title: SNAP Payment Integration Gateway API
  version: "1.0"
paths:
  /admin/clients:
    post:
      description: 'Creates a new client_app trust-anchor record and, if publicKeyPem
        is supplied, its first client_key in the same call. State-changing: creates
        persistent client onboarding records.'
      parameters:
      - description: Static admin API key (ADMIN_API_KEY)
        in: header
        name: X-Admin-API-Key
        required: true
        type: string
      - description: Client registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterClientRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "400":
          description: Invalid payload, missing clientId/clientName/keyId, or invalid
            publicKeyPem
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "401":
          description: Unauthorized. Invalid or missing X-Admin-API-Key header
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "503":
          description: Admin API disabled (ADMIN_API_KEY not set)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AdminToken: []
      summary: Register a new B2B client
      tags:
      - Admin Client Management
  /admin/clients/{clientId}/keys:
    post:
      description: 'Registers an additional active public key for an existing client
        (e.g. key rotation). State-changing: creates a persistent client_key record.'
      parameters:
      - description: Static admin API key (ADMIN_API_KEY)
        in: header
        name: X-Admin-API-Key
        required: true
        type: string
      - description: Client identifier
        in: path
        name: clientId
        required: true
        type: string
      - description: Client key payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.AddClientKeyRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "400":
          description: Missing clientId, missing keyId/publicKeyPem, or invalid publicKeyPem
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "401":
          description: Unauthorized. Invalid or missing X-Admin-API-Key header
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "503":
          description: Admin API disabled (ADMIN_API_KEY not set)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AdminToken: []
      summary: Add a client key
      tags:
      - Admin Client Management
  /admin/clients/{clientId}/keys/{keyId}:
    delete:
      description: 'Revokes (deactivates) a client''s public key so it can no longer
        be used to verify signatures. State-changing: updates a persistent client_key
        record.'
      parameters:
      - description: Static admin API key (ADMIN_API_KEY)
        in: header
        name: X-Admin-API-Key
        required: true
        type: string
      - description: Client identifier
        in: path
        name: clientId
        required: true
        type: string
      - description: Key identifier to revoke
        in: path
        name: keyId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "400":
          description: Missing clientId or keyId path parameters
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "401":
          description: Unauthorized. Invalid or missing X-Admin-API-Key header
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "503":
          description: Admin API disabled (ADMIN_API_KEY not set)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AdminToken: []
      summary: Revoke a client key
      tags:
      - Admin Client Management
  /admin/clients/{clientId}/secret:
    post:
      description: 'Registers an additional active shared secret for an existing client,
        used to verify merchant-facing X-SIGNATURE. State-changing: creates a persistent
        client_secret record. The secret value is never echoed back in any response.'
      parameters:
      - description: Static admin API key (ADMIN_API_KEY)
        in: header
        name: X-Admin-API-Key
        required: true
        type: string
      - description: Client identifier
        in: path
        name: clientId
        required: true
        type: string
      - description: Client secret payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.AddClientSecretRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "400":
          description: Missing clientId, missing secretId/secretValue
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "401":
          description: Unauthorized. Invalid or missing X-Admin-API-Key header
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "503":
          description: Admin API disabled (ADMIN_API_KEY not set)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AdminToken: []
      summary: Provision a merchant shared secret
      tags:
      - Admin Client Management
