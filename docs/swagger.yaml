      tags:
      - Admin Client Management
  /admin/transactions/{virtualAccountNo}/reconcile:
    post:
      description: 'Admin-only: calls the vendor''s SNAP Inquiry Status service (code
        26) for the given virtualAccountNo. If the vendor reports the payment as successful
        while this service still had it pending, the transaction is settled and the
        merchant payment callback is sent. Safe to call repeatedly — an already-settled
        transaction is reported back without a second callback.'
      parameters:
      - description: Admin API key
        in: header
        name: X-Admin-API-Key
        required: true
        type: string
      - description: Virtual account number
        in: path
        name: virtualAccountNo
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.reconcileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.reconcileErrorResponse'
        "404":
          description: Transaction not found
          schema:
            $ref: '#/definitions/handler.reconcileErrorResponse'
        "503":
          description: Reconciliation is not configured for this deployment
          schema:
