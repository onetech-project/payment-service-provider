            $ref: '#/definitions/domain.MerchantCreateVAResponse'
        "409":
          description: 'Conflict: request already in progress for this X-EXTERNAL-ID'
          schema:
            $ref: '#/definitions/domain.MerchantCreateVAResponse'
        "422":
          description: X-EXTERNAL-ID reused with a different payload
          schema:
            $ref: '#/definitions/domain.MerchantCreateVAResponse'
