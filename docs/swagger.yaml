            or an in-flight request still holding the key
          schema:
            $ref: '#/definitions/domain.VAPaymentResponse'
        "500":
          description: 5002500 Internal Server Error
          schema:
            $ref: '#/definitions/domain.VAPaymentResponse'
      security:
      - SnapTimestamp: []
      - SnapSignature: []
      summary: VA payment notification
      tags:
      - Virtual Account
  /openapi/v2.0/transfer-va/status:
    post:
      description: Vendor-initiated inquiry of the current payment status of a Virtual
        Account transaction. Read-only. Registered under /openapi/v2.0 as well as
        v1.0 — BCA calls this service at v2.0.
      parameters:
      - description: Bearer accessToken issued by POST /openapi/v1.0/access-token/b2b.
          Required for vendors onboarded with a VENDOR_CLIENT_ID; the token is also
          bound into the AccessToken component of stringToSign
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request timestamp, ISO 8601
        in: header
        name: X-TIMESTAMP
        required: true
        type: string
      - description: Symmetric signature; compute via POST /api/v1/utilities/signature-service
        in: header
        name: X-SIGNATURE
        required: true
        type: string
      - description: Partner ID using Company Code VA, max 8 chars (BCA tech docs
          v2.3/v2.4). Value-checked whenever the vendor config sets VENDOR_PARTNER_ID
        in: header
        name: X-PARTNER-ID
        required: true
        type: string
      - description: Numeric string, max 36 chars, unique per calendar day. Doubles
          as the idempotency key
        in: header
        name: X-EXTERNAL-ID
        required: true
        type: string
      - description: 'PJP channel id (BCA VA: 95231). Value-checked whenever the vendor
          config sets VENDOR_CHANNEL_ID'
        in: header
        name: CHANNEL-ID
        required: true
        type: string
      - description: VA status request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.VAStatusRequest'
      responses:
        "200":
          description: 2002600 Success. paymentFlagStatus 00 settled / 01 rejected
            / 02 timeout / 03 pending
          schema:
            $ref: '#/definitions/domain.VAStatusResponse'
        "400":
          description: 4002600 Bad Request (unparseable body), 4002601 Invalid Field
            Format {field}, 4002602 Invalid Mandatory Field {field}
          schema:
            $ref: '#/definitions/domain.VAStatusResponse'
        "401":
          description: 4012600 Unauthorized. [reason], 4012601 Invalid Token (B2B)
          schema:
            $ref: '#/definitions/domain.SNAPErrorResponse'
        "404":
          description: 4042601 Transaction Not Found
          schema:
            $ref: '#/definitions/domain.VAStatusResponse'
        "409":
          description: 4092600 Conflict — X-EXTERNAL-ID reused
          schema:
            $ref: '#/definitions/domain.VAStatusResponse'
        "500":
          description: 5002601 Internal Server Error
          schema:
            $ref: '#/definitions/domain.VAStatusResponse'
      security:
      - SnapTimestamp: []
      - SnapSignature: []
      summary: VA payment status inquiry
      tags:
      - Virtual Account
securityDefinitions:
  AdminToken:
    description: Static admin API key configured via the ADMIN_API_KEY environment
      variable. Required for all /admin/* endpoints.
    in: header
    name: X-Admin-API-Key
    type: apiKey
  BearerAuth:
    description: Bearer access token issued by POST /openapi/v1.0/access-token/b2b,
      e.g. "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
  SnapClientKey:
    description: Client identifier issued by the admin during onboarding. Required
      on the B2B access-token endpoint.
    in: header
    name: X-CLIENT-KEY
    type: apiKey
  SnapSignature:
    description: Request signature. Compute via POST /api/v1/utilities/signature-auth
      (asymmetric, access-token endpoint) or POST /api/v1/utilities/signature-service
      (symmetric, transaction endpoints).
    in: header
    name: X-SIGNATURE
    type: apiKey
  SnapTimestamp:
    description: Request timestamp in ISO 8601 format (e.g. 2026-07-24T10:00:00+07:00).
    in: header
    name: X-TIMESTAMP
    type: apiKey
swagger: "2.0"
