          on merchant routes — send it for SNAP conformance
        in: header
        name: X-PARTNER-ID
        type: string
      - description: PJP channel id, 5 chars. Mandatory per the ASPI spec but NOT
          enforced on merchant routes — send it for SNAP conformance
        in: header
        name: CHANNEL-ID
        type: string
      - description: VA create/update request. additionalInfo.dbUrlProcess carries
          the merchant payment-callback URL (see description).
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.MerchantCreateVARequest'
      responses:
        "200":
          description: additionalInfo.dbUrlProcess is echoed back in virtualAccountData.additionalInfo
          schema:
            $ref: '#/definitions/domain.MerchantCreateVAResponse'
        "400":
          description: Invalid Field Format / Invalid Mandatory Field
          schema:
            $ref: '#/definitions/domain.MerchantCreateVAResponse'
        "401":
          description: 'Unauthorized: missing/invalid/expired accessToken, invalid/missing
