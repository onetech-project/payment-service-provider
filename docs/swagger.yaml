        be used to verify signatures. State-changing: updates a persistent client_secret
        record.'
      parameters:
      - description: Static admin API key (ADMIN_API_KEY)
        in: header
        name: X-Admin-API-Key
        required: true
        type: string
      - description: Client identifier
        in: path
        name: clientId
        required: true
        type: string
      - description: Secret identifier to revoke
        in: path
        name: secretId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "400":
          description: Missing clientId or secretId path parameters
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "401":
          description: Unauthorized. Invalid or missing X-Admin-API-Key header
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.clientResponse'
        "503":
