# SonarQube / SonarScanner configuration for payment-service-provider.
# Coverage data is produced by `make test-cover` (go test -coverprofile=coverage.out),
# which must run before the scanner so coverage.out exists at scan time.

sonar.projectKey=payment-service-provider
sonar.projectName=Payment Service Provider
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/vendor/**,**/docs/**,**/*.pb.go

# Go coverage report produced by `make test-cover`.
sonar.go.coverage.reportPaths=coverage.out

# Coverage should only be measured on production code, not generated docs,
# mocks/fakes, main/wiring code, or the thin infra wrappers (DB/Redis/queue/
# telemetry) that only call SDKs directly and would need testcontainers to
# test meaningfully. Kept in sync with COVERAGE_EXCLUDE in the Makefile
# (`make coverage-inscope`) so the local and SonarQube coverage % match.
sonar.coverage.exclusions=**/docs/**,**/*_test.go,**/cmd/**,**/mocks/**,\
  internal/infrastructure/database/**,\
  internal/infrastructure/redis/**,\
  internal/infrastructure/queue/**,\
  internal/infrastructure/telemetry/**

sonar.sourceEncoding=UTF-8
