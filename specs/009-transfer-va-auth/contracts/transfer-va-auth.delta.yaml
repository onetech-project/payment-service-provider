openapi: 3.0.3
info:
  title: Transfer-VA endpoints — signature/token enforcement (delta)
  version: "1.0.0"
  description: >
    Delta describing new admission-control (401) responses for the existing
    POST/DELETE endpoints under /openapi/v1.0/transfer-va/*. No request or
    success-response schema changes, and no new configuration input — these
    checks are unconditional from deployment (no per-vendor toggle).
paths:
  /openapi/v1.0/transfer-va/inquiry:
    post:
      description: >
        Unchanged request/response schema. NEW: this endpoint now returns
        401 for a signature that does not verify against the vendor's
        shared secret, or for a timestamp outside the allowed freshness
        window. Enforced unconditionally for every vendor/channel from
        deployment.
      responses:
        '401':
          description: >
            NEW: X-SIGNATURE does not match the recomputed HMAC, or
            X-TIMESTAMP is outside the ±5 minute freshness window, or the
            vendor/channel has no configured shared secret (fail-closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /openapi/v1.0/transfer-va/payment:
    post:
      description: Same delta as /inquiry above.
      responses:
        '401':
          description: Same delta as /inquiry above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /openapi/v1.0/transfer-va/status:
    post:
      description: Same delta as /inquiry above.
      responses:
        '401':
          description: Same delta as /inquiry above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /openapi/v1.0/transfer-va/create-va:
    post:
      description: >
        Unchanged request/response schema. NEW: requires a valid
        `Authorization: Bearer <accessToken>` header (issued by the existing
        POST /access-token/b2b endpoint). Previously this endpoint had no
        authentication check at all.
      security:
        - BearerAuth: []
      responses:
        '401':
          description: >
            NEW: Authorization header missing, malformed, or bearer token
            invalid/expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /openapi/v1.0/transfer-va/list:
    post:
      description: Same delta as /create-va above (bearer token now required).
      security:
        - BearerAuth: []
      responses:
        '401':
          description: Same delta as /create-va above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /openapi/v1.0/transfer-va/delete-va:
    delete:
      description: Same delta as /create-va above (bearer token now required).
      security:
        - BearerAuth: []
      responses:
        '401':
          description: Same delta as /create-va above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: accessToken issued by POST /openapi/v1.0/access-token/b2b.
  schemas:
    ErrorResponse:
      type: object
      description: Unchanged shape from existing error responses across this API.
      properties:
        responseCode:
          type: string
          description: "4010000 for missing/invalid auth (existing convention from snap_auth.go)."
        responseMessage:
          type: string
