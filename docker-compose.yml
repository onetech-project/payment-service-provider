services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=${PORT:-8080}
      # Hardcoded for the same reason as CONFIG_DIR below: the repo-root .env
      # sets DB_HOST=localhost / DB_PORT=5433 for local non-Docker runs, and
      # compose would substitute those here — but inside the compose network
      # the app must reach the postgres container on its internal 5432.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-payment_gateway}
      # Hardcoded for the same reason as DB_HOST above: .env sets
      # localhost:6379 for local non-Docker runs.
      - REDIS_ADDR=redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_CONNECT_TIMEOUT_SECONDS=${REDIS_CONNECT_TIMEOUT_SECONDS:-5}
      - IDEMPOTENCY_LOCK_TTL_SECONDS=${IDEMPOTENCY_LOCK_TTL_SECONDS:-30}
      - IDEMPOTENCY_CACHE_TTL_SECONDS=${IDEMPOTENCY_CACHE_TTL_SECONDS:-86400}
      - ASYNQ_REDIS_ADDR=redis:6379
      - ASYNQ_REDIS_PASSWORD=${ASYNQ_REDIS_PASSWORD:-}
      - ASYNQ_REDIS_DB=${ASYNQ_REDIS_DB:-1}
      - ASYNQ_CONCURRENCY=${ASYNQ_CONCURRENCY:-10}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Hardcoded (not ${CONFIG_DIR:-/config}): the repo-root .env file sets
      # CONFIG_DIR=. for local non-Docker runs, and docker compose loads that
      # .env automatically for variable substitution — which would silently
      # override the /config default here and break vendor config loading.
      - CONFIG_DIR=/config
      - ADMIN_API_KEY=${ADMIN_API_KEY:-changeme}
      - APP_ENV=${APP_ENV:-dev}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Origin, Content-Type, Accept, Authorization, X-TIMESTAMP, X-SIGNATURE, X-CLIENT-KEY, X-PARTNER-ID, X-EXTERNAL-ID, CHANNEL-ID, X-Admin-API-Key}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./.env.bca.va:/config/.env.bca.va:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  postgres:
    # Pinned to 16 to match the existing postgres_data volume (and the README
    # tech stack). Bumping the major version requires pg_upgrade or wiping the
    # volume — postgres refuses to start on a data dir from an older major.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-payment_gateway}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  migrate:
    image: migrate/migrate:v4.15.2
    command: ["-path", "/migrations", "-database", "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@host.docker.internal:${DB_PORT:-5433}/${DB_NAME:-payment_gateway}?sslmode=disable", "up"]
    volumes:
      - ./db/migrations:/migrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

  # ------------------------------------------------------------------
  # Observability stack: app exposes /metrics (Prometheus) and structured
  # JSON logs on stdout; Alloy tails container logs and ships them to Loki;
  # Grafana is pre-provisioned with both as datasources plus a starter
  # dashboard. See observability/ for all config.
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
